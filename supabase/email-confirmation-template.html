<!doctype html>
<html lang="de">
  <body style="margin:0;background:#090b10;color:#f5f7fb;font-family:Arial,sans-serif;padding:32px 16px">
    <div style="max-width:480px;margin:auto;background:#11151d;border:1px solid #303846;border-radius:20px;padding:28px">
      <div style="color:#ff6b35;font-size:24px;font-weight:900;letter-spacing:3px">FORGE</div>
      <h1 style="font-size:24px;margin:28px 0 10px">Dein Bestätigungscode</h1>
      <p style="color:#a8b0bf;line-height:1.6">Gib diesen Code direkt in FORGE ein. Du musst keinen Link öffnen.</p>
      <div style="background:#090b10;border:1px solid #ff6b3555;border-radius:14px;padding:18px;text-align:center;font-size:32px;font-weight:900;letter-spacing:8px;color:#ff9f43">{{ .Token }}</div>
      <p style="color:#8d96a8;font-size:12px;line-height:1.5;margin-top:24px">Falls du kein FORGE-Konto erstellt hast, kannst du diese Nachricht ignorieren.</p>
    </div>
  </body>
</html>
